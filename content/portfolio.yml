#
# 每个项目支持以下链接类型（可同时存在多个）：
#   - blogSlug: 关联的博客文章 slug（如 "text2sql-finetuning-practice"）
#   - projectPagePath: 站内静态项目页路径（如 "/project/hrsrg/index.html"）
#   - externalLink: 外部链接（如 GitHub、Demo 页面）
#   - projectSlug: 独立的项目详情页 slug（预留，暂不实现）
#
# 卡片点击行为优先级：blogSlug > projectPagePath > externalLink > projectSlug

